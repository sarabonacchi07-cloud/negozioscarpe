<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Official Store - Nuova Collezione</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #0f0f0f;
            color: #f4f4f4;
        }

        /* BARRA DI NAVIGAZIONE */
        header {
            background-color: #000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e61025;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo span {
            color: #e61025;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #e61025;
        }

        /* SEZIONE HERO / BANNER */
        .hero {
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(15,15,15,1) 100%), url('https://via.placeholder.com/1200x400/111/fff?text=BE+LEGENDARY') no-repeat center center/cover;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        .badge-novita {
            background-color: #e61025;
            color: #fff;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .hero h2 {
            font-size: 2.8rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .hero p {
            color: #aaa;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* CONTENITORE PRINCIPALE PRODOTTO */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .prodotto-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .prodotto-immagine {
            flex: 1;
            min-width: 320px;
            background-color: #141414;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
        }

        .prodotto-immagine img {
            width: 100%;
            max-width: 450px;
            height: auto;
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        .prodotto-immagine:hover img {
            transform: scale(1.05) rotate(-2deg);
        }

        .prodotto-dettagli {
            flex: 1;
            min-width: 320px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .categoria {
            color: #e61025;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .prodotto-dettagli h3 {
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 15px;
            color: #fff;
        }

        .descrizione {
            color: #bbb;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
